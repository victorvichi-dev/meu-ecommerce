<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ManceGamer - Home</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app-container">
        <!-- 1. Identidade Visual no Cabeçalho -->
        <header class="top-header">
            <div class="logo">
                <a href="index.html" class="logo-link">
                    <img src="logo_manchau.svg" alt="Logotipo Oficial ManChau Gamer" width="50" height="50">
                    <span class="logo-text">Man<span>Chau</span></span>
                </a>
            </div>

            <nav class="nav-menu">
                <a href="index.html">Início</a>
                <a href="produto.html">Produtos</a>
                <a href="carrinho.html">Carrinho</a>
                <a href="cadastro.html">Cadastro</a>
            </nav>

            <div class="header-actions">
                <a href="carrinho.html" class="cart-btn" aria-label="Carrinho de Compras">
                    🛒 <span class="cart-badge">3</span>
                </a>
            </div>
        </header>

        <!-- 2. Banner Principal / Carrossel -->
        <section class="hero">
            <div class="carousel-container">
                <div class="carousel-slide">
                    <img src="bannerpc.svg" alt="Banner promocional de PCs Gamers de alta performance com desconto">
                </div>
                <div class="carousel-slide">
                    <img src="bannerperiferico.svg" alt="Banner promocional de periféricos gamer com iluminação RGB personalizável">
                </div>
                <div class="carousel-slide">
                    <img src="bannerconsole.svg" alt="Banner de lançamentos e promoções imperdíveis de consoles da nova geração">
                </div>
            </div>
        </section>

        <!-- 3. Navegação por Categorias com Imagens Circulares -->
        <section class="categories-section">
            <h2 class="section-title">Navegue por Categorias</h2>
            <div class="categories-container">
                <a href="#lancamentos" class="category-item">
                    <div class="category-thumb">
                        <img src="https://images.unsplash.com/photo-1542751371-adc38448a05e?w=300&auto=format&fit=crop&q=80" alt="Categoria Lançamentos de Jogos e Hardware" width="120" height="120" loading="lazy">
                    </div>
                    <span>Lançamentos</span>
                </a>
                <a href="#ofertas" class="category-item">
                    <div class="category-thumb">
                        <img src="https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?w=300&auto=format&fit=crop&q=80" alt="Categoria Ofertas e Promoções Especiais" width="120" height="120" loading="lazy">
                    </div>
                    <span>Ofertas</span>
                </a>
                <a href="#acessorios" class="category-item">
                    <div class="category-thumb">
                        <img src="https://images.unsplash.com/photo-1527814050087-3793815479db?w=300&auto=format&fit=crop&q=80" alt="Categoria Acessórios Gamer e Fones" width="120" height="120" loading="lazy">
                    </div>
                    <span>Acessórios</span>
                </a>
                <a href="#mais-vendidos" class="category-item">
                    <div class="category-thumb">
                        <img src="https://images.unsplash.com/photo-1612287232252-0d17d525cb1f?w=300&auto=format&fit=crop&q=80" alt="Categoria Produtos Mais Vendidos e Bem Avaliados" width="120" height="120" loading="lazy">
                    </div>
                    <span>Mais Vendidos</span>
                </a>
            </div>
        </section>

        <!-- 4 e 5. Vitrine de Produtos Padronizada e Produto Esgotado -->
        <section class="showcase-section">
            <h2 class="section-title">Destaques da Loja</h2>
            <div class="products-grid">
                
                <!-- Produto 1 -->
                <article class="product-card">
                    <a href="produto.html" class="product-link">
                        <figure class="product-figure">
                            <img src="images/image.png" alt="Processador Gamer de Alto Desempenho Octa-Core" width="400" height="400" loading="lazy">
                            <figcaption>
                                <h3 class="product-title">Processador Gamer Pro 8-Core</h3>
                                <p class="product-price">R$ 1.899,90</p>
                            </figcaption>
                        </figure>
                    </a>
                </article>

                <!-- Produto 2 -->
                <article class="product-card">
                    <a href="produto.html" class="product-link">
                        <figure class="product-figure">
                            <img src="https://images.unsplash.com/photo-1615663245857-ac93bb7c39e7?w=600&auto=format&fit=crop&q=80" alt="Mouse Gamer Óptico RGB 16000 DPI com Botões Programáveis" width="400" height="400" loading="lazy">
                            <figcaption>
                                <h3 class="product-title">Mouse Gamer RGB 16000 DPI</h3>
                                <p class="product-price">R$ 249,90</p>
                            </figcaption>
                        </figure>
                    </a>
                </article>

                <!-- Produto 3 -->
                <article class="product-card">
                    <a href="produto.html" class="product-link">
                        <figure class="product-figure">
                            <img src="https://images.unsplash.com/photo-1511447333015-45b65e60f6d5?w=600&auto=format&fit=crop&q=80" alt="Teclado Mecânico Gamer Switch Blue com Iluminação RGB" width="400" height="400" loading="lazy">
                            <figcaption>
                                <h3 class="product-title">Teclado Mecânico RGB Switch Blue</h3>
                                <p class="product-price">R$ 389,00</p>
                            </figcaption>
                        </figure>
                    </a>
                </article>

                <!-- Produto 4 -->
                <article class="product-card">
                    <a href="produto.html" class="product-link">
                        <figure class="product-figure">
                            <img src="https://images.unsplash.com/photo-1546435770-a3e426bf472b?w=600&auto=format&fit=crop&q=80" alt="Headset Gamer Surround 7.1 com Microfone Antirruído" width="400" height="400" loading="lazy">
                            <figcaption>
                                <h3 class="product-title">Headset Gamer 7.1 Surround</h3>
                                <p class="product-price">R$ 329,90</p>
                            </figcaption>
                        </figure>
                    </a>
                </article>

                <!-- Produto 5: ESGOTADO (Requisito 5) -->
                <article class="product-card sold-out">
                    <span class="sold-out-badge">ESGOTADO</span>
                    <figure class="product-figure">
                        <img src="https://images.unsplash.com/photo-1591488320449-011701bb6704?w=600&auto=format&fit=crop&q=80" alt="Placa de Vídeo Gamer Ray Tracing 16GB GDDR6" width="400" height="400" loading="lazy">
                        <figcaption>
                            <h3 class="product-title">Placa de Vídeo RTX Extreme 16GB</h3>
                            <p class="product-price">R$ 4.599,00</p>
                        </figcaption>
                    </figure>
                </article>

                <!-- Produto 6 -->
                <article class="product-card">
                    <a href="produto.html" class="product-link">
                        <figure class="product-figure">
                            <img src="https://images.unsplash.com/photo-1526738549149-8e07eca6c147?w=600&auto=format&fit=crop&q=80" alt="Monitor Gamer Curvo 144Hz de 27 Polegadas Quad HD" width="400" height="400" loading="lazy">
                            <figcaption>
                                <h3 class="product-title">Monitor Gamer Curvo 27" 144Hz</h3>
                                <p class="product-price">R$ 1.499,00</p>
                            </figcaption>
                        </figure>
                    </a>
                </article>

            </div>
        </section>

        <!-- Rodapé Padrão -->
        <footer class="main-footer">
            <p>&copy; 2026 ManChau Gamer - Todos os direitos reservados.</p>
        </footer>
    </div>
</body>

</html>
